# Checks the app and publishes it to GitHub Pages on every push to main.
# The site: https://biidakk.github.io/ucime-se-s-elenkou/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check content, translations and types
        run: |
          npm run check-content
          npm run check-i18n
          npx tsc --noEmit
      - name: Build the web app
        run: npm run build:web
        env:
          # Address of the AI conversation partner (server/chat). Empty = the feature is hidden.
          EXPO_PUBLIC_CHAT_URL: ${{ vars.CHAT_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
